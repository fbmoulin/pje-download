# Configuracao do gitleaks para o pje-download.
#
# POR QUE ESTE ARQUIVO EXISTE
# ---------------------------
# Este repositorio e PUBLICO e o codigo lida com autos judiciais. O ruleset
# embutido do gitleaks cobre bem credenciais de provedor (AWS, GitHub, Google),
# mas foi verificado em 2026-07-18 que ele NAO tem nenhuma regra para PII
# brasileira: grep por cpf/cnpj/cnj nas ~200 regras oficiais deu ZERO
# ocorrencias. O mesmo vale para trufflehog, detect-secrets e git-secrets.
# Por isso as regras [[rules]] abaixo sao obrigatorias e escritas a mao.
#
# O que este arquivo NAO cobre, e nao tem como cobrir:
#   - NOME DE PESSOA. Nao existe regex viavel ("duas palavras capitalizadas"
#     casa com nome de classe, de cidade, de lei, de arquivo). Só NER
#     resolveria, e ha decisao registrada com sign-off contra usar NER.
#     Num repo publico, essa e a exposicao residual mais seria.
#   - CPF/CNPJ sem pontuacao: falso positivo alto demais para bloquear no
#     gitleaks, que nao executa codigo de validacao. Ficam para a 2a etapa,
#     em tools/validate_br_pii.py, que valida digito verificador.
#
# Uso (o hook pre-push faz isso automaticamente):
#   gitleaks git --log-opts="<range>" --config .gitleaks.toml --redact -v .
# --redact e OBRIGATORIO: sem ele o achado e impresso no terminal e nos logs,
# e o proprio gate vira vetor de vazamento.

title = "pje-download — segredos + PII brasileira"

[extend]
# Mantem as ~200 regras oficiais de credencial. As regras abaixo SOMAM.
useDefault = true

# ---------------------------------------------------------------------------
# Numero de processo CNJ — Resolucao CNJ 65/2008
# Formato NNNNNNN-DD.AAAA.J.TR.OOOO (7 sequencial, 2 DV, 4 ano, 1 segmento,
# 2 tribunal, 4 origem). O DV usa Modulo 97 Base 10 (ISO 7064), NAO modulo 11
# — mas para um gate isso e irrelevante: o formato pontuado ja e distintivo
# o bastante e quase nao colide com outra coisa.
# ---------------------------------------------------------------------------
[[rules]]
id = "br-cnj-process-number"
description = "Numero de processo CNJ nao mascarado (PII de autos)"
regex = '''\b\d{7}-\d{2}\.\d{4}\.\d\.\d{2}\.\d{4}\b'''
tags = ["pii", "br", "cnj"]
# SEM `keywords` DE PROPOSITO: keywords e pre-filtro de performance — se
# presente, a regra so dispara quando a palavra aparece por perto. O numero de
# processo aparece nu, sem rotulo, entao keywords geraria FALSO NEGATIVO.

  [[rules.allowlists]]
  description = "numeros de teste/fixture"
  regexes = [
    '''0000000-00\.0000\.0\.00\.0000''',
    '''1234567-89\.2024\.8\.26\.0100''',
  ]

# ---------------------------------------------------------------------------
# CPF pontuado. A forma nua (11 digitos) NAO entra aqui: casaria com qualquer
# timestamp em ms, protocolo ou id de banco. Ela e tratada na 2a etapa, com
# validacao de digito verificador.
# ---------------------------------------------------------------------------
[[rules]]
id = "br-cpf-formatted"
description = "CPF pontuado (PII) - confirmar DV em tools/validate_br_pii.py"
regex = '''\b\d{3}\.\d{3}\.\d{3}-\d{2}\b'''
tags = ["pii", "br", "cpf"]

  [[rules.allowlists]]
  description = "CPFs de teste: digitos repetidos passam no modulo 11 mas sao invalidos"
  # ENUMERADO DE PROPOSITO. O padrao natural seria com retrovisor —
  # \b(\d)\1{2}\.\1{3}\.\1{3}-\1{2}\b — mas o gitleaks usa RE2 (motor do Go),
  # que NAO suporta retrovisor: nao e limitacao de sintaxe, e decisao de projeto
  # do RE2 para garantir tempo linear. Com retrovisor o gitleaks nao apenas
  # ignora a regra: ele CRASHA no parse do config (verificado em 2026-07-19).
  # Como so existem 10 CPFs de digito repetido, enumerar e exato e barato.
  regexes = [
    '''\b(?:000\.000\.000-00|111\.111\.111-11|222\.222\.222-22|333\.333\.333-33|444\.444\.444-44|555\.555\.555-55|666\.666\.666-66|777\.777\.777-77|888\.888\.888-88|999\.999\.999-99)\b''',
  ]

# ---------------------------------------------------------------------------
# CNPJ. ATENCAO AO PRAZO: a partir de 31/07/2026 (IN RFB 2.229/2024) o CNPJ
# passa a ser ALFANUMERICO — as 12 primeiras posicoes aceitam A-Z, os 2 DVs
# continuam numericos. Uma regra so com \d teria falso negativo nas inscricoes
# novas, por isso o padrao abaixo ja usa [A-Z0-9]. Isso cobre tambem os CNPJs
# numericos legados, que continuam validos.
# ---------------------------------------------------------------------------
[[rules]]
id = "br-cnpj"
description = "CNPJ pontuado, formato alfanumerico (vigente 31/07/2026) e legado"
regex = '''\b[A-Z0-9]{2}\.[A-Z0-9]{3}\.[A-Z0-9]{3}/[A-Z0-9]{4}-\d{2}\b'''
tags = ["pii", "br", "cnpj"]

  [[rules.allowlists]]
  description = "CNPJs de teste"
  regexes = [
    '''00\.000\.000/0000-00''',
    '''11\.111\.111/1111-11''',
  ]

# ===========================================================================
# IDENTIFICADORES DE INFRAESTRUTURA (adicionados 2026-07-27)
# ===========================================================================
# POR QUE ESTE BLOCO EXISTE
# -------------------------
# Em 2026-07-25 quatro linhas rastreadas carregavam o IP publico do VPS vivo,
# uma delas junto do usuario de deploy e do nome da chave SSH (commit fb405e7
# redigiu). O gate reportou ZERO sobre elas: as regras acima procuram
# credencial e PII de pessoa, e um IP nao e nenhuma das duas coisas.
#
# O comentario no topo deste arquivo diz que NOME DE PESSOA e o buraco residual
# insoluvel. Identificador de infraestrutura era um SEGUNDO buraco — e, ao
# contrario de nome, ele E regexavel. Lido em conjunto, IP + usuario + caminho
# da chave + porta da app e um mapa operacional do host, publicado num repo
# publico. Nenhum item isolado e segredo; a soma e.
#
# ⚠️ ALLOWLIST POR VALOR, NUNCA POR CAMINHO. Os dois IPs mortos ficaram nos
# docs de PROPOSITO (um deles e o ASSUNTO de docs/plans/2026-06-26-*.md, cujos
# passos fazem grep por ele). A tentacao e allowlistar `docs/` — mas foi
# exatamente em docs/ que o IP VIVO estava. Escopar por caminho cegaria a regra
# na unica arvore onde ela ja provou ser necessaria.
# ---------------------------------------------------------------------------

[[rules]]
id = "infra-public-ipv4"
description = "IPv4 publico (endereco de host de producao)"
# Octetos validados (0-255) para reduzir colisao com versao de 4 partes e com
# numero solto. RE2 nao tem lookahead, entao "publico" NAO e expresso no regex:
# a negacao mora nos allowlists abaixo, que e a forma RE2-compativel de dizer
# "isto menos aquilo".
regex = '''\b(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\b'''
tags = ["infra", "host"]

  [[rules.allowlists]]
  description = "faixas nao-roteaveis: RFC1918, loopback, link-local, wildcard, mascaras"
  regexes = [
    '''\b10\.(?:\d{1,3}\.){2}\d{1,3}\b''',
    '''\b192\.168\.\d{1,3}\.\d{1,3}\b''',
    '''\b172\.(?:1[6-9]|2[0-9]|3[01])\.\d{1,3}\.\d{1,3}\b''',
    '''\b127\.(?:\d{1,3}\.){2}\d{1,3}\b''',
    '''\b169\.254\.\d{1,3}\.\d{1,3}\b''',
    '''\b0\.0\.0\.0\b''',
    '''\b255\.255\.255\.\d{1,3}\b''',
  ]

  [[rules.allowlists]]
  description = "versao de 4 partes em User-Agent — NAO e endereco"
  # `Chrome/120.0.0.0` casa com qualquer regex de dotted-quad; foi a colisao
  # mais comum na medicao de 2026-07-27 (6 dos 12 falsos positivos). RE2 nao
  # tem lookbehind, entao nao da para dizer "nao precedido de barra" dentro do
  # regex da regra. `regexTarget = "line"` resolve pelo outro lado: o allowlist
  # passa a olhar a LINHA inteira, onde o token `Chrome/` fica visivel.
  regexTarget = "line"
  regexes = [
    '''(?i)(?:chrome|firefox|safari|edg|opr|version|mozilla)/\d{1,4}(?:\.\d{1,4}){3}''',
  ]

  [[rules.allowlists]]
  description = "faixas de DOCUMENTACAO (RFC 5737) e placeholders canonicos"
  # Existem para aparecer em exemplo e teste; por definicao nao roteiam para
  # lugar nenhum. `1.2.3.4`/`5.6.7.8` nao sao RFC 5737, mas sao o placeholder
  # de facto — aparecem em docs/superpowers/plans/2026-04-04-* como chave de
  # bucket de rate-limit, e trata-los como achado ensinaria a ignorar o gate.
  regexes = [
    '''\b192\.0\.2\.\d{1,3}\b''',
    '''\b198\.51\.100\.\d{1,3}\b''',
    '''\b203\.0\.113\.\d{1,3}\b''',
    '''\b1\.2\.3\.4\b''',
    '''\b5\.6\.7\.8\b''',
  ]

  [[rules.allowlists]]
  description = "IPs DESATIVADOS mantidos de proposito — allowlist POR VALOR"
  # 2.24.126.161 = VPS antigo em Boston (morto desde a mudanca de regiao).
  # 191.252.204.250 = host anterior, e o ASSUNTO de
  # docs/plans/2026-06-26-vps-deploy-verifier-sdd.md, cujos passos de
  # verificacao fazem grep por ele. Apagar quebraria um documento executavel
  # para proteger um endereco morto.
  # ⚠️ Se um destes voltar a apontar para algo vivo, REMOVA a linha daqui.
  regexes = [
    '''\b2\.24\.126\.161\b''',
    '''\b191\.252\.204\.250\b''',
  ]

# ---------------------------------------------------------------------------
# E-mail institucional .jus.br. O `@` e o discriminador: o repo esta cheio de
# URLs .jus.br legitimas (pje.tjes.jus.br e a propria funcao da app) e nenhuma
# delas casa. Endereco de servidor do tribunal identifica uma PESSOA dentro de
# um orgao, o que e PII sob a LGPD, e cria alvo de phishing dirigido.
# ---------------------------------------------------------------------------
[[rules]]
id = "infra-jusbr-email"
description = "E-mail institucional .jus.br (identifica pessoa em orgao)"
regex = '''\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]*\bjus\.br\b'''
tags = ["pii", "br", "infra"]

# ---------------------------------------------------------------------------
# Convite de SSH completo: `ssh -i <chave> <usuario>@<host>`. Uma linha dessas
# publica de uma vez o caminho da chave, o nome do usuario de deploy e o host —
# o mapa operacional inteiro numa linha copiavel.
#
# O host tem de ser LITERAL para casar. `ssh -i ~/.ssh/deploy_key
# "${VPS_USER}@${VPS_HOST}"` (deploy.yml) NAO dispara, e nao deve: um template
# que resolve a partir de secrets nao publica nada. E o que se quer proibir e
# a forma ja resolvida.
# ---------------------------------------------------------------------------
[[rules]]
id = "infra-ssh-invite"
description = "Linha `ssh -i <chave> <user>@<host>` com host literal"
regex = '''ssh\s+-i\s+\S+\s+[A-Za-z_][A-Za-z0-9_.-]*@(?:(?:[A-Za-z0-9-]+\.)+[A-Za-z]{2,}|(?:\d{1,3}\.){3}\d{1,3})'''
tags = ["infra", "host"]

# ---------------------------------------------------------------------------
# Allowlist global: caminhos onde PII sintetica e esperada.
# Mantida DELIBERADAMENTE curta. Cada caminho aqui e um ponto cego permanente;
# quando o gate reclamar de um caso legitimo, prefira o allowlist por regex
# (acima) ou o fingerprint em .gitleaksignore, que sao cirurgicos.
# ---------------------------------------------------------------------------
[allowlist]
description = "caminhos com dados sinteticos"
paths = [
  '''\.gitleaks\.toml$''',
  '''tools/validate_br_pii\.py$''',
  '''tools/verify_gitleaks_rules\.sh$''',
  '''tests/fixtures/.*\.(json|xml)$''',
]
