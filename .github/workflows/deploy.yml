name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    needs: []
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate required secrets
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          MNI_USERNAME: ${{ secrets.MNI_USERNAME }}
          MNI_PASSWORD: ${{ secrets.MNI_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
        run: |
          : "${VPS_SSH_KEY:?VPS_SSH_KEY is required}"
          : "${VPS_HOST:?VPS_HOST is required}"
          : "${VPS_USER:?VPS_USER is required}"
          : "${MNI_USERNAME:?MNI_USERNAME is required}"
          : "${MNI_PASSWORD:?MNI_PASSWORD is required}"
          : "${REDIS_PASSWORD:?REDIS_PASSWORD is required (must not be default)}"
          : "${DASHBOARD_API_KEY:?DASHBOARD_API_KEY is required}"
        shell: bash

      - name: Sync files to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          rsync -az --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='downloads_batch/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.serena/' \
            --exclude='.claude/' \
            --exclude='.pytest_cache/' \
            --exclude='.worktrees/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ "${VPS_USER}@${VPS_HOST}:/opt/pje-download/"

      - name: Write .env on VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          MNI_USERNAME: ${{ secrets.MNI_USERNAME }}
          MNI_PASSWORD: ${{ secrets.MNI_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
          # The commit this deploy is shipping. There is no git on the VPS (rsync
          # excludes .git/), so the workflow is the only place that knows it.
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: MNI_USERNAME,MNI_PASSWORD,REDIS_PASSWORD,DASHBOARD_API_KEY,BUILD_SHA
          script: |
            : "${MNI_USERNAME:?missing MNI_USERNAME secret}"
            : "${MNI_PASSWORD:?missing MNI_PASSWORD secret}"
            : "${REDIS_PASSWORD:?missing REDIS_PASSWORD secret}"
            : "${DASHBOARD_API_KEY:?missing DASHBOARD_API_KEY secret}"
            : "${BUILD_SHA:?missing BUILD_SHA — refusing to deploy an unidentifiable build}"
            {
              printf 'APP_ENV=production\n'
              printf 'BUILD_SHA=%s\n' "${BUILD_SHA}"
              printf 'MNI_USERNAME=%s\n' "${MNI_USERNAME}"
              printf 'MNI_PASSWORD=%s\n' "${MNI_PASSWORD}"
              printf 'MNI_TRIBUNAL=TJES\n'
              printf 'MNI_TIMEOUT=60\n'
              printf 'MNI_BATCH_SIZE=5\n'
              printf 'MNI_ENABLED=true\n'
              printf 'PJE_BASE_URL=https://pje.tjes.jus.br/pje\n'
              printf 'DASHBOARD_API_KEY=%s\n' "${DASHBOARD_API_KEY}"
              printf 'REDIS_PASSWORD=%s\n' "${REDIS_PASSWORD}"
              printf 'REDIS_URL=redis://:%s@redis:6379\n' "${REDIS_PASSWORD}"
              printf 'DOWNLOAD_BASE_DIR=/data/downloads\n'
              printf 'HEALTH_PORT=8006\n'
              printf 'DASHBOARD_PORT=8007\n'
              printf 'WORKER_HEALTH_HOST=worker\n'
              printf 'TRUST_X_FORWARDED_FOR=false\n'
              printf 'AUDIT_LOG_RETENTION_DAYS=90\n'
            } > /opt/pje-download/.env

      - name: Restart services
        uses: appleboy/ssh-action@v1.2.5
        env:
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: REDIS_PASSWORD,DASHBOARD_API_KEY,BUILD_SHA
          script: |
            set -e
            cd /opt/pje-download
            docker compose --profile worker up -d --build dashboard worker

            echo "Waiting for worker healthcheck..."
            for i in $(seq 1 24); do
              worker_health=$(curl -fsS http://localhost:8006/health || true)
              if printf '%s' "$worker_health" | grep -Eq '"healthy"[[:space:]]*:[[:space:]]*true'; then
                break
              fi
              sleep 5
            done
            printf '%s' "$worker_health" | grep -Eq '"healthy"[[:space:]]*:[[:space:]]*true'

            # ── Provenance, not just function ──
            # Everything above is satisfied by the PREVIOUS build just as well as
            # by this one: a stale image that never got replaced answers "healthy"
            # exactly the same. This is the only check that names WHICH commit is
            # serving. See docs/superpowers/specs/2026-07-27-build-sha-health-identity.md
            echo "Asserting the running worker reports the deployed build..."
            running_sha=$(printf '%s' "$worker_health" \
              | sed -n 's/.*"build_sha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            echo "  expected: ${BUILD_SHA}"
            echo "  running:  ${running_sha:-<absent>}"
            if [ -z "$running_sha" ] || [ "$running_sha" = "unknown" ]; then
              echo "FAIL: /health carries no build identity. Either BUILD_SHA never reached"
              echo "the build args, or the running image predates this change. Both are"
              echo "indistinguishable from a stale image at this point, so this is a failure."
              exit 1
            fi
            if [ "$running_sha" != "$BUILD_SHA" ]; then
              echo "FAIL: THE RUNNING CODE IS NOT WHAT THIS DEPLOY BUILT."
              echo "Do NOT measure or conclude anything against this instance."
              exit 1
            fi
            echo "  OK — running build matches the deployed commit."

            echo "Waiting for dashboard healthcheck..."
            for i in $(seq 1 24); do
              dashboard_status=$(curl -fsS -H "X-API-Key: $DASHBOARD_API_KEY" http://localhost:8007/api/status || true)
              if printf '%s' "$dashboard_status" | grep -Eq '"worker_status"[[:space:]]*:[[:space:]]*"(ready|consuming)"'; then
                break
              fi
              sleep 5
            done
            printf '%s' "$dashboard_status" | grep -Eq '"worker_status"[[:space:]]*:[[:space:]]*"(ready|consuming)"'

            # The dashboard is a SEPARATE image, so it needs its own provenance
            # check: the worker matching proves nothing about it. /healthz is used
            # rather than /api/status because it is public by design.
            echo "Asserting the running dashboard reports the deployed build..."
            # No -f on purpose: /healthz answers 503 when a batch is pending resume,
            # and -f would discard the body. Readiness is already asserted above via
            # /api/status; here we only want the identity, which 503 still carries.
            dash_health=$(curl -sS http://localhost:8007/healthz || true)
            dash_sha=$(printf '%s' "$dash_health" \
              | sed -n 's/.*"build_sha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            echo "  expected: ${BUILD_SHA}"
            echo "  running:  ${dash_sha:-<absent>}"
            if [ "$dash_sha" != "$BUILD_SHA" ]; then
              echo "FAIL: the dashboard is not running the build this deploy produced."
              exit 1
            fi
            echo "  OK — dashboard build matches the deployed commit."

            echo "Running queue smoke test..."
            before_dead=$(docker compose exec -T redis redis-cli -a "$REDIS_PASSWORD" LLEN kratos:pje:dead-letter | tr -d '\r')
            docker compose exec -T redis redis-cli -a "$REDIS_PASSWORD" RPUSH kratos:pje:jobs '{invalid-json' >/dev/null
            for i in $(seq 1 12); do
              after_dead=$(docker compose exec -T redis redis-cli -a "$REDIS_PASSWORD" LLEN kratos:pje:dead-letter | tr -d '\r')
              if [ "$after_dead" -gt "$before_dead" ]; then
                break
              fi
              sleep 5
            done
            test "${after_dead:-$before_dead}" -gt "$before_dead"
            echo "Deploy OK"

      - name: Validate MNI credentials
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/pje-download
            echo "Validating MNI credentials on VPS..."
            if docker compose exec -T dashboard python -c "from mni_client import MNIClient; MNIClient()"; then
              echo "MNI credentials are valid"
            else
              echo "MNI validation failed"
              exit 1
            fi
