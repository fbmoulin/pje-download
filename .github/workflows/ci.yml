name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**", ".serena/**", ".claude/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".serena/**", ".claude/**"]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        # Pinned deliberately. An unpinned `pip install ruff` follows upstream releases, so a
        # new rule set turns CI red on a repo nobody touched -- and because `test` needs `lint`
        # and `deploy.yml` gates on CI concluding success, a red lint silently kills the deploy
        # pipeline too. That is exactly what happened: this job passed on 0.14.14 and, once
        # upstream moved to 0.16.0, reported 208 errors and 7 reformats on unchanged code,
        # leaving Deploy dead from 2026-07-19 to 2026-07-25.
        # Bumping this pin is a real task with its own PR (new rules must be fixed, not waived).
        run: pip install ruff==0.14.14

      - name: Check
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Verify Markdown specs
        run: python tools/verify_spec.py docs/specs/*.md

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    env:
      MNI_USERNAME: ""
      MNI_PASSWORD: ""
      MNI_TRIBUNAL: TJES
      REDIS_URL: redis://localhost:6379
      DOWNLOAD_BASE_DIR: /tmp/pje-test-downloads

    services:
      redis:
        image: redis:7.4-alpine
        # Published so the real-socket BLPOP regression test in
        # tests/test_redis_socket_timeout.py actually runs instead of skipping.
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 3

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -q --tb=short
